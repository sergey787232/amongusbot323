<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чертеж Тобота</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #080c14;
            color: #58a6ff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        /* Экран разблокировки (Модальное окно из скриншота) */
        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .lock-card {
            background: #121824;
            border: 1px solid #1e2638;
            border-radius: 20px;
            width: 340px;
            padding: 35px 25px 40px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .lock-title {
            color: #00bfff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .lock-subtitle {
            color: #6e7681;
            font-size: 15px;
            margin-bottom: 30px;
        }

        #pattern-canvas {
            touch-action: none;
            cursor: pointer;
        }

        /* Основной интерфейс */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #blueprint {
            border: 2px solid #1e2638;
            background: #011627;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            background: #161b22;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #21262d;
            border-color: #58a6ff;
            color: #79c0ff;
        }
    </style>
</head>
<body>

    <!-- Модальный экран графического ключа -->
    <div class="lock-overlay" id="lockScreen">
        <div class="lock-card">
            <div class="lock-title" id="lockTitle">Нарисуйте букву 'Г'</div>
            <div class="lock-subtitle">на графическом ключе</div>
            <canvas id="pattern-canvas" width="240" height="240"></canvas>
        </div>
    </div>

    <!-- Основная часть с чертежом -->
    <div class="app-container">
        <h1 id="bot-title" style="margin: 0; font-size: 24px;">Чертеж Тобота</h1>
        <canvas id="blueprint" width="600" height="450"></canvas>
        <div class="controls">
            <button onclick="openLock('G')">Ввести ключ для Гуся (Г)</button>
            <button onclick="openLock('K')">Ввести ключ для Курочки (К)</button>
        </div>
    </div>

    <script>
        // Элементы
        const lockScreen = document.getElementById('lockScreen');
        const lockTitle = document.getElementById('lockTitle');
        const canvas = document.getElementById('blueprint');
        const ctx = canvas.getContext('2d');
        const title = document.getElementById('bot-title');

        let targetMode = 'G'; // 'G' или 'K'
        let currentMode = 'G';

        // Открытие замка
        function openLock(mode) {
            targetMode = mode;
            lockTitle.textContent = mode === 'G' ? "Нарисуйте букву 'Г'" : "Нарисуйте букву 'К'";
            lockScreen.style.display = 'flex';
            resetPattern();
        }

        // Вызов по клавиатуре (буквы Г / K)
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'g' || k === 'г') openLock('G');
            if (k === 'k' || k === 'к') openLock('K');
        });

        // Отрисовка чертежа
        function drawGrid() {
            ctx.strokeStyle = 'rgba(88, 166, 255, 0.08)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function drawGoose() {
            title.textContent = "Чертеж: Тобот-Гусь";
            ctx.strokeStyle = '#00bfff';
            ctx.lineWidth = 2;

            ctx.strokeRect(220, 200, 160, 120); // Корпус
            ctx.strokeRect(230, 80, 70, 40);   // Голова

            // Шея
            ctx.beginPath();
            ctx.moveTo(240, 200); ctx.lineTo(240, 120); ctx.lineTo(280, 120); ctx.lineTo(280, 200);
            ctx.stroke();

            // Стальной клюв без плазмы
            ctx.beginPath();
            ctx.moveTo(230, 95); ctx.lineTo(170, 105); ctx.lineTo(230, 115);
            ctx.closePath();
            ctx.stroke();

            // Крылья и сопла
            ctx.strokeRect(140, 220, 80, 40);
            ctx.strokeRect(380, 220, 80, 40);
            ctx.strokeRect(250, 320, 30, 40);
            ctx.strokeRect(320, 320, 30, 40);

            ctx.fillStyle = '#00bfff';
            ctx.font = '16px monospace';
            ctx.fillText("МОДУЛЬ: «HONK!»", 30, 40);
        }

        function drawChicken() {
            title.textContent = "Чертеж: Тобот-Курочка";
            ctx.strokeStyle = '#ff5555';
            ctx.lineWidth = 2;

            ctx.strokeRect(210, 180, 180, 140); // Корпус
            ctx.strokeRect(250, 80, 100, 60);   // Голова
            ctx.strokeRect(260, 140, 80, 40);   // Шея

            // Гребешок
            ctx.beginPath();
            ctx.moveTo(270, 80); ctx.lineTo(280, 55); ctx.lineTo(300, 80); ctx.lineTo(310, 55); ctx.lineTo(330, 80);
            ctx.stroke();

            // Клюв и бородка
            ctx.beginPath();
            ctx.moveTo(250, 100); ctx.lineTo(210, 112); ctx.lineTo(250, 124);
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(265, 134, 7, 0, Math.PI * 2);
            ctx.stroke();

            // Крылья и лапы
            ctx.strokeRect(150, 210, 60, 60);
            ctx.strokeRect(390, 210, 60, 60);
            ctx.strokeRect(250, 320, 30, 50);
            ctx.strokeRect(320, 320, 30, 50);

            ctx.fillStyle = '#ffaa55';
            ctx.font = '16px monospace';
            ctx.fillText("МОДУЛЬ: «CLUCK-CLUCK!»", 30, 40);
        }

        function drawBlueprint() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            if (currentMode === 'G') drawGoose();
            else drawChicken();
        }

        // --- ЛОГИКА ГРАФИЧЕСКОГО КЛЮЧА ---
        const pCanvas = document.getElementById('pattern-canvas');
        const pCtx = pCanvas.getContext('2d');

        const points = [];
        const size = 3;
        const spacing = 70;
        const offset = 50;

        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                points.push({
                    id: r * size + c + 1,
                    x: offset + c * spacing,
                    y: offset + r * spacing
                });
            }
        }

        let selected = [];
        let isDrawing = false;

        function renderPattern(mousePos = null) {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            // Линии
            if (selected.length > 0) {
                pCtx.strokeStyle = '#00bfff';
                pCtx.lineWidth = 4;
                pCtx.beginPath();
                const start = points.find(p => p.id === selected[0]);
                pCtx.moveTo(start.x, start.y);

                for (let i = 1; i < selected.length; i++) {
                    const pt = points.find(p => p.id === selected[i]);
                    pCtx.lineTo(pt.x, pt.y);
                }

                if (mousePos && isDrawing) {
                    pCtx.lineTo(mousePos.x, mousePos.y);
                }
                pCtx.stroke();
            }

            // Точки (Стиль как на скрине)
            points.forEach(pt => {
                const active = selected.includes(pt.id);

                // Внешний темный круг
                pCtx.beginPath();
                pCtx.arc(pt.x, pt.y, 22, 0, Math.PI * 2);
                pCtx.fillStyle = active ? 'rgba(0, 191, 255, 0.2)' : 'rgba(255, 255, 255, 0.05)';
                pCtx.fill();

                // Внутренняя точка
                pCtx.beginPath();
                pCtx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
                pCtx.fillStyle = active ? '#00bfff' : '#556070';
                pCtx.fill();
            });
        }

        function getMousePos(e) {
            const rect = pCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function checkHit(pos) {
            return points.find(p => Math.hypot(p.x - pos.x, p.y - pos.y) < 25);
        }

        function startDraw(e) {
            isDrawing = true;
            selected = [];
            const pos = getMousePos(e);
            const hit = checkHit(pos);
            if (hit) selected.push(hit.id);
            renderPattern(pos);
        }

        function moveDraw(e) {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            const hit = checkHit(pos);
            if (hit && !selected.includes(hit.id)) {
                selected.push(hit.id);
            }
            renderPattern(pos);
        }

        function endDraw() {
            if (!isDrawing) return;
            isDrawing = false;

            // Проверка узора
            if (selected.length > 1) {
                currentMode = targetMode;
                drawBlueprint();
                lockScreen.style.display = 'none';
            }
            resetPattern();
        }

        function resetPattern() {
            selected = [];
            renderPattern();
        }

        pCanvas.addEventListener('mousedown', startDraw);
        pCanvas.addEventListener('mousemove', moveDraw);
        window.addEventListener('mouseup', endDraw);

        pCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
        pCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveDraw(e); });
        window.addEventListener('touchend', endDraw);

        // Первый запуск
        drawBlueprint();
        renderPattern();
    </script>
</body>
</html>
