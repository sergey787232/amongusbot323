<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Летающий Тобот-Гусь, Тобот-Курочка и Интеграция Птица-Титан</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #12141a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            overflow: hidden;
            background: #191c24;
        }

        canvas {
            display: block;
            background: #191c24;
        }

        .btn-reset {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: #282d37;
            border: 2px solid #00c8ff;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            transition: all 0.2s ease;
        }

        .btn-reset:active {
            transform: translateX(-50%) scale(0.95);
            background: #00c8ff;
            color: #12141a;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="appCanvas" width="450" height="650"></canvas>
        <button id="resetBtn" class="btn-reset">Заблокировать</button>
    </div>

<script>
    const canvas = document.getElementById('appCanvas');
    const ctx = canvas.getContext('2d');
    const resetBtn = document.getElementById('resetBtn');

    const WIDTH = 450;
    const HEIGHT = 650;

    let state = "LOCK"; // "LOCK" или "ROBOT"
    let activeRobot = "GOOSE"; // "GOOSE", "CHICKEN" или "TITAN"
    let isDrawing = false;
    let pattern = [];
    let currentPos = { x: 0, y: 0 };

    let animTime = 0;
    let drawProgress = 0;

    // Сетка ключа 3x3
    const gridOffsetY = 320;
    const spacing = 100;
    const nodes = {};

    let idx = 1;
    for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
            nodes[idx] = {
                x: WIDTH / 2 + (col - 1) * spacing,
                y: gridOffsetY + (row - 1) * spacing
            };
            idx++;
        }
    }

    // Буква Г (Гусь)
    const goosePatterns = [
        [7, 4, 1, 2, 3],
        [3, 2, 1, 4, 7],
        [7, 1, 3],
        [3, 1, 7]
    ];

    // Буква К (Курочка)
    const chickenPatterns = [
        [1, 4, 7, 5, 3],
        [1, 4, 7, 5, 9],
        [7, 4, 1, 5, 3],
        [7, 4, 1, 5, 9],
        [3, 5, 7, 4, 1],
        [3, 5, 1, 4, 7]
    ];

    // Буква П (Интеграция: Гусь + Курочка = Птица-Титан)
    const titanPatterns = [
        [7, 4, 1, 2, 3, 6, 9],
        [9, 6, 3, 2, 1, 4, 7],
        [1, 2, 3, 6, 9, 7, 4]
    ];

    // --- ЭКРАН БЛОКИРОВКИ ---
    function drawLockScreen(t) {
        ctx.fillStyle = "#191c24";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.textAlign = "center";
        ctx.fillStyle = "#00c8ff";
        ctx.font = "bold 24px sans-serif";
        ctx.fillText("Нарисуйте букву 'Г', 'К' или 'П'", WIDTH / 2, 80);

        ctx.fillStyle = "#78828c";
        ctx.font = "16px sans-serif";
        ctx.fillText("на графическом ключе", WIDTH / 2, 110);

        ctx.fillStyle = "#464f60";
        ctx.font = "13px sans-serif";
        ctx.fillText("Г — Гусь  |  К — Курочка  |  П — Птица-Титан", WIDTH / 2, 138);

        if (pattern.length > 1) {
            ctx.beginPath();
            ctx.strokeStyle = "#00c8ff";
            ctx.lineWidth = 8 + Math.sin(t * 5) * 1.5;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.moveTo(nodes[pattern[0]].x, nodes[pattern[0]].y);
            for (let i = 1; i < pattern.length; i++) {
                ctx.lineTo(nodes[pattern[i]].x, nodes[pattern[i]].y);
            }
            ctx.stroke();
        }

        if (isDrawing && pattern.length > 0) {
            const lastNode = nodes[pattern[pattern.length - 1]];
            ctx.beginPath();
            ctx.strokeStyle = "rgba(0, 200, 255, 0.6)";
            ctx.lineWidth = 4;
            ctx.moveTo(lastNode.x, lastNode.y);
            ctx.lineTo(currentPos.x, currentPos.y);
            ctx.stroke();
        }

        for (let id in nodes) {
            const node = nodes[id];
            const isSelected = pattern.includes(parseInt(id));
            const pulse = isSelected ? Math.sin(t * 6) * 2 : 0;

            ctx.beginPath();
            ctx.arc(node.x, node.y, (isSelected ? 24 : 20) + pulse, 0, Math.PI * 2);
            ctx.fillStyle = isSelected ? "#00c8ff" : "#282d37";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(node.x, node.y, isSelected ? 10 : 6, 0, Math.PI * 2);
            ctx.fillStyle = isSelected ? "#ffffff" : "#78828c";
            ctx.fill();
        }
    }

    // --- Вспомогательная прорисовка линий ---
    function strokePathProgress(pathFn, approxLength, progress, strokeColor, lineWidth) {
        if (progress <= 0) return;
        ctx.save();
        ctx.beginPath();
        pathFn();
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (progress < 1) {
            ctx.setLineDash([approxLength, approxLength]);
            ctx.lineDashOffset = approxLength * (1 - progress);
        } else {
            ctx.setLineDash([]);
        }

        ctx.stroke();
        ctx.restore();
    }

    // --- ТОБОТ-ГУСЬ (ЛЕТАЮЩИЙ) ---
    function drawRobotGoose(t, prog) {
        ctx.fillStyle = "#191c24";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const flyY = prog >= 1 ? Math.sin(t * 2.5) * 14 : 0;
        const flyX = prog >= 1 ? Math.cos(t * 1.8) * 6 : 0;

        const cx = WIDTH / 2 + flyX;
        const cy = HEIGHT / 2 - 25 + flyY;

        const pAntenna = Math.min(1, Math.max(0, prog / 0.2));
        const pHead    = Math.min(1, Math.max(0, (prog - 0.15) / 0.35));
        const pScreen  = Math.min(1, Math.max(0, (prog - 0.45) / 0.25));
        const pGoose   = Math.min(1, Math.max(0, (prog - 0.65) / 0.25));
        const pFills   = Math.min(1, Math.max(0, (prog - 0.85) / 0.15));

        if (pFills > 0.5) {
            const flameH = 15 + Math.sin(t * 15) * 8;
            ctx.save();
            ctx.globalAlpha = pFills;

            ctx.beginPath();
            ctx.fillStyle = "#ff8c00";
            ctx.moveTo(cx - 70, cy + 120);
            ctx.lineTo(cx - 60, cy + 120 + flameH);
            ctx.lineTo(cx - 50, cy + 120);
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = "#ff8c00";
            ctx.moveTo(cx + 50, cy + 120);
            ctx.lineTo(cx + 60, cy + 120 + flameH);
            ctx.lineTo(cx + 70, cy + 120);
            ctx.fill();

            ctx.fillStyle = "#00c8ff";
            ctx.beginPath();
            ctx.moveTo(cx - 66, cy + 120);
            ctx.lineTo(cx - 60, cy + 120 + flameH * 0.6);
            ctx.lineTo(cx - 54, cy + 120);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + 54, cy + 120);
            ctx.lineTo(cx + 60, cy + 120 + flameH * 0.6);
            ctx.lineTo(cx + 66, cy + 120);
            ctx.fill();

            ctx.restore();
        }

        strokePathProgress(() => {
            ctx.moveTo(cx - 15, cy - 140);
            ctx.lineTo(cx, cy - 190);
            ctx.lineTo(cx + 15, cy - 140);
        }, 120, pAntenna, "#00c8ff", 4);

        if (pAntenna > 0.5) {
            const lightGlow = prog >= 1 ? (Math.sin(t * 6) * 0.5 + 0.5) : 0;
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy - 190, 10 + lightGlow * 4, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 200, 255, ${0.4 + lightGlow * 0.5})`;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy - 190, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#00c8ff";
            ctx.fill();
            ctx.restore();
        }

        const drawWing = (side) => {
            const dir = side === 'left' ? -1 : 1;
            ctx.beginPath();
            ctx.moveTo(cx + dir * 140, cy - 60);
            ctx.lineTo(cx + dir * 180, cy - 20);
            ctx.lineTo(cx + dir * 180, cy + 80);
            ctx.lineTo(cx + dir * 140, cy + 120);
            ctx.closePath();
        };

        strokePathProgress(() => { drawWing('left'); drawWing('right'); }, 600, pHead, "#00c8ff", 3);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#282d37";
            drawWing('left'); ctx.fill();
            drawWing('right'); ctx.fill();
            ctx.strokeStyle = "#464f60";
            ctx.lineWidth = 3;
            drawWing('left'); ctx.stroke();
            drawWing('right'); ctx.stroke();
            ctx.restore();
        }

        const drawHeadPlate = () => {
            ctx.moveTo(cx - 140, cy - 100);
            ctx.lineTo(cx - 80, cy - 140);
            ctx.lineTo(cx + 80, cy - 140);
            ctx.lineTo(cx + 140, cy - 100);
            ctx.lineTo(cx + 140, cy + 90);
            ctx.lineTo(cx + 90, cy + 130);
            ctx.lineTo(cx - 90, cy + 130);
            ctx.lineTo(cx - 140, cy + 90);
            ctx.closePath();
        };

        strokePathProgress(drawHeadPlate, 1100, pHead, "#00c8ff", 4);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#2e3440";
            ctx.beginPath(); drawHeadPlate(); ctx.fill();
            ctx.strokeStyle = "#4c566a";
            ctx.lineWidth = 4;
            ctx.stroke();

            const bolts = [
                [cx - 120, cy - 90], [cx + 120, cy - 90],
                [cx - 120, cy + 80], [cx + 120, cy + 80]
            ];
            bolts.forEach(([bx, by]) => {
                ctx.beginPath();
                ctx.arc(bx, by, 6, 0, Math.PI * 2);
                ctx.fillStyle = "#1e222a";
                ctx.fill();
            });
            ctx.restore();
        }

        const drawScreenRect = () => {
            ctx.moveTo(cx - 100, cy - 80);
            ctx.lineTo(cx + 100, cy - 80);
            ctx.lineTo(cx + 100, cy + 70);
            ctx.lineTo(cx - 100, cy + 70);
            ctx.closePath();
        };

        strokePathProgress(drawScreenRect, 680, pScreen, "#00c8ff", 3);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#0f141e";
            ctx.beginPath(); drawScreenRect(); ctx.fill();
            ctx.strokeStyle = "#00c8ff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        const headWobble = prog >= 1 ? Math.sin(t * 3) * 3 : 0;
        const honkOpen   = prog >= 1 ? Math.max(0, Math.sin(t * 5)) * 14 : 0;

        const gx = cx - 20 + headWobble;
        const gy = cy - 10;

        strokePathProgress(() => {
            ctx.moveTo(cx - 30, cy + 70);
            ctx.lineTo(cx + 10, cy + 70);
            ctx.lineTo(cx + 5 + headWobble, cy - 10);
            ctx.lineTo(cx - 35 + headWobble, cy - 10);
            ctx.closePath();
        }, 300, pGoose, "#ffffff", 3);

        strokePathProgress(() => {
            ctx.arc(gx, gy, 30, 0, Math.PI * 2);
        }, 200, pGoose, "#ffffff", 3);

        strokePathProgress(() => {
            ctx.moveTo(gx + 15, gy - 8);
            ctx.lineTo(gx + 70, gy + 5);
            ctx.lineTo(gx + 15, gy + 20 + honkOpen);
            ctx.closePath();
        }, 200, pGoose, "#ff8c00", 3);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;

            ctx.beginPath();
            ctx.fillStyle = "#e5e9f0";
            ctx.moveTo(cx - 30, cy + 70);
            ctx.lineTo(cx + 10, cy + 70);
            ctx.lineTo(cx + 5 + headWobble, cy - 10);
            ctx.lineTo(cx - 35 + headWobble, cy - 10);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.arc(gx, gy, 30, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = "#d08770";
            ctx.moveTo(gx + 15, gy - 8);
            ctx.lineTo(gx + 70, gy + 5);
            ctx.lineTo(gx + 15, gy + 10);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = "#bf616a";
            ctx.moveTo(gx + 15, gy + 10);
            ctx.lineTo(gx + 65, gy + 12 + honkOpen);
            ctx.lineTo(gx + 15, gy + 18 + honkOpen);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.arc(gx - 5, gy - 10, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#1e222a";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(gx - 5, gy - 10, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#00c8ff";
            ctx.fill();

            ctx.beginPath();
            ctx.strokeStyle = "#2e3440";
            ctx.lineWidth = 4;
            ctx.moveTo(gx - 16, gy - 20);
            ctx.lineTo(gx + 6, gy - 14);
            ctx.stroke();

            ctx.restore();
        }

        if (pFills > 0.5) {
            const honkScale = prog >= 1 ? (1 + Math.sin(t * 5) * 0.12) : (pFills - 0.5) * 2;
            const bubbleX = cx + 55;
            const bubbleY = cy - 60 + (prog >= 1 ? Math.sin(t * 5) * -4 : 0);

            ctx.save();
            ctx.translate(bubbleX, bubbleY);
            ctx.scale(honkScale, honkScale);

            ctx.beginPath();
            ctx.ellipse(0, 0, 42, 20, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.fillStyle = "#000000";
            ctx.font = "bold 16px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HONK!", 0, 6);
            ctx.restore();

            ctx.fillStyle = `rgba(0, 200, 255, ${pFills})`;
            ctx.font = "bold 22px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("ТОБОТ-ГУСЬ АКТИВИРОВАН", WIDTH / 2, HEIGHT - 90);
        }
    }

    // --- ТОБОТ-КУРОЧКА ПЛИМУТРОК ---
    function drawRobotChicken(t, prog) {
        ctx.fillStyle = "#191c24";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const flyY = prog >= 1 ? Math.sin(t * 3.5) * 8 : 0;
        const flyX = prog >= 1 ? Math.cos(t * 2.2) * 6 : 0;

        const cx = WIDTH / 2 + flyX;
        const cy = HEIGHT / 2 + 10 + flyY;

        const pComb   = Math.min(1, Math.max(0, prog / 0.2));
        const pHead   = Math.min(1, Math.max(0, (prog - 0.15) / 0.35));
        const pScreen = Math.min(1, Math.max(0, (prog - 0.45) / 0.25));
        const pChick  = Math.min(1, Math.max(0, (prog - 0.65) / 0.25));
        const pFills  = Math.min(1, Math.max(0, (prog - 0.85) / 0.15));

        if (pFills > 0.5) {
            const flameH = 16 + Math.sin(t * 18) * 6;
            ctx.save();
            ctx.globalAlpha = pFills;

            ctx.fillStyle = "#ff4500";
            ctx.beginPath();
            ctx.moveTo(cx - 65, cy + 115);
            ctx.lineTo(cx - 50, cy + 115 + flameH);
            ctx.lineTo(cx - 35, cy + 115);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + 35, cy + 115);
            ctx.lineTo(cx + 50, cy + 115 + flameH);
            ctx.lineTo(cx + 65, cy + 115);
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.moveTo(cx - 60, cy + 115);
            ctx.lineTo(cx - 50, cy + 115 + flameH * 0.6);
            ctx.lineTo(cx - 40, cy + 115);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + 40, cy + 115);
            ctx.lineTo(cx + 50, cy + 115 + flameH * 0.6);
            ctx.lineTo(cx + 60, cy + 115);
            ctx.fill();

            ctx.restore();
        }

        const drawChickenTail = () => {
            ctx.moveTo(cx - 110, cy - 30);
            ctx.lineTo(cx - 150, cy - 110);
            ctx.lineTo(cx - 115, cy - 130);
            ctx.lineTo(cx - 80, cy - 70);
            ctx.closePath();
        };

        strokePathProgress(drawChickenTail, 400, pHead, "#ffffff", 3);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#1b1d22";
            ctx.beginPath(); drawChickenTail(); ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx - 140, cy - 105); ctx.lineTo(cx - 105, cy - 65);
            ctx.moveTo(cx - 130, cy - 85);  ctx.lineTo(cx - 95, cy - 45);
            ctx.stroke();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.beginPath(); drawChickenTail(); ctx.stroke();
            ctx.restore();
        }

        const drawChickenBody = () => {
            ctx.moveTo(cx - 120, cy - 40);
            ctx.quadraticCurveTo(cx - 30, cy - 75, cx + 50, cy - 50);
            ctx.lineTo(cx + 100, cy - 10);
            ctx.quadraticCurveTo(cx + 110, cy + 70, cx + 20, cy + 110);
            ctx.lineTo(cx - 80, cy + 110);
            ctx.quadraticCurveTo(cx - 130, cy + 50, cx - 120, cy - 40);
            ctx.closePath();
        };

        strokePathProgress(drawChickenBody, 1200, pHead, "#ffffff", 4);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#22252b";
            ctx.beginPath(); drawChickenBody(); ctx.fill();

            ctx.strokeStyle = "#e2e5ec";
            ctx.lineWidth = 4;
            for (let y = cy - 60; y <= cy + 100; y += 14) {
                ctx.beginPath();
                ctx.moveTo(cx - 100, y);
                ctx.quadraticCurveTo(cx, y + 8, cx + 90, y - 4);
                ctx.stroke();
            }

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath(); drawChickenBody(); ctx.stroke();
            ctx.restore();
        }

        const drawChickenWing = () => {
            ctx.beginPath();
            ctx.ellipse(cx - 10, cy + 25, 65, 42, 0.2, 0, Math.PI * 2);
        };

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#181a1f";
            drawChickenWing(); ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            for (let i = -30; i <= 30; i += 15) {
                ctx.beginPath();
                ctx.moveTo(cx - 50, cy + 20 + i);
                ctx.lineTo(cx + 30, cy + 25 + i);
                ctx.stroke();
            }

            ctx.strokeStyle = "#ff2244";
            ctx.lineWidth = 2.5;
            drawChickenWing(); ctx.stroke();
            ctx.restore();
        }

        const drawChickenScreen = () => {
            ctx.moveTo(cx - 45, cy - 15);
            ctx.lineTo(cx + 45, cy - 15);
            ctx.lineTo(cx + 45, cy + 45);
            ctx.lineTo(cx - 45, cy + 45);
            ctx.closePath();
        };

        strokePathProgress(drawChickenScreen, 400, pScreen, "#ff2244", 3);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#0c0d10";
            ctx.beginPath(); drawChickenScreen(); ctx.fill();
            ctx.strokeStyle = "#ff2244";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();
        }

        const headBobbing = prog >= 1 ? Math.sin(t * 7) * 4 : 0;
        const cluckOpen   = prog >= 1 ? Math.max(0, Math.sin(t * 6)) * 10 : 0;

        const kx = cx + 60 + headBobbing;
        const ky = cy - 55;

        strokePathProgress(() => {
            ctx.moveTo(cx + 30, cy - 40);
            ctx.lineTo(kx - 10, ky + 10);
            ctx.lineTo(kx + 15, ky + 10);
            ctx.lineTo(cx + 60, cy - 30);
        }, 150, pChick, "#ffffff", 3);

        strokePathProgress(() => {
            ctx.arc(kx, ky, 24, 0, Math.PI * 2);
        }, 160, pChick, "#ffffff", 3);

        strokePathProgress(() => {
            ctx.moveTo(kx + 12, ky - 4);
            ctx.lineTo(kx + 38, ky + 3);
            ctx.lineTo(kx + 12, ky + 12 + cluckOpen);
            ctx.closePath();
        }, 120, pChick, "#ffcc00", 3);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;

            ctx.beginPath();
            ctx.fillStyle = "#22252b";
            ctx.moveTo(cx + 30, cy - 40);
            ctx.lineTo(kx - 10, ky + 10);
            ctx.lineTo(kx + 15, ky + 10);
            ctx.lineTo(cx + 60, cy - 30);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(kx, ky, 24, 0, Math.PI * 2);
            ctx.fillStyle = "#dcdfe6";
            ctx.fill();

            ctx.strokeStyle = "#1b1d22";
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(kx - 12, ky - 4); ctx.lineTo(kx, ky - 4);
            ctx.moveTo(kx - 14, ky + 4); ctx.lineTo(kx - 2, ky + 4);
            ctx.stroke();

            ctx.beginPath();
            ctx.fillStyle = "#ff1a3c";
            ctx.moveTo(kx - 16, ky - 18);
            ctx.lineTo(kx - 10, ky - 38);
            ctx.lineTo(kx - 2, ky - 26);
            ctx.lineTo(kx + 6, ky - 40);
            ctx.lineTo(kx + 14, ky - 24);
            ctx.lineTo(kx + 20, ky - 12);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = "#ff1a3c";
            ctx.ellipse(kx + 8, ky + 24, 7, 12, -0.2, 0, Math.PI * 2);
            ctx.ellipse(kx + 18, ky + 22, 6, 10, 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = "#ffcc00";
            ctx.moveTo(kx + 12, ky - 4);
            ctx.lineTo(kx + 40, ky + 2);
            ctx.lineTo(kx + 12, ky + 7);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.fillStyle = "#e6b800";
            ctx.moveTo(kx + 12, ky + 7);
            ctx.lineTo(kx + 35, ky + 8 + cluckOpen);
            ctx.lineTo(kx + 12, ky + 12 + cluckOpen);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.arc(kx - 2, ky - 6, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#ff1a3c";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(kx - 2, ky - 6, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = "#0c0d10";
            ctx.fill();

            ctx.restore();
        }

        if (pFills > 0.5) {
            const cluckScale = prog >= 1 ? (1 + Math.sin(t * 7) * 0.1) : (pFills - 0.5) * 2;
            const bubbleX = kx + 45;
            const bubbleY = ky - 35;

            ctx.save();
            ctx.translate(bubbleX, bubbleY);
            ctx.scale(cluckScale, cluckScale);

            ctx.beginPath();
            ctx.ellipse(0, 0, 48, 20, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.fillStyle = "#000000";
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("CLUCK-CLUCK!", 0, 4);
            ctx.restore();

            ctx.fillStyle = `rgba(255, 34, 68, ${pFills})`;
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("ТОБОТ-КУРОЧКА АКТИВИРОВАНА", WIDTH / 2, HEIGHT - 90);
        }
    }

    // --- ИНТЕГРАЦИЯ: ПТИЦА-ТИТАН (ГУСЬ + КУРОЧКА) ---
    function drawRobotTitan(t, prog) {
        ctx.fillStyle = "#0f121a";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const flyY = prog >= 1 ? Math.sin(t * 2.8) * 12 : 0;
        const flyX = prog >= 1 ? Math.cos(t * 1.8) * 6 : 0;

        const cx = WIDTH / 2 + flyX;
        const cy = HEIGHT / 2 + flyY;

        const pHead   = Math.min(1, Math.max(0, (prog - 0.1) / 0.35));
        const pScreen = Math.min(1, Math.max(0, (prog - 0.4) / 0.25));
        const pChick  = Math.min(1, Math.max(0, (prog - 0.6) / 0.25));
        const pFills  = Math.min(1, Math.max(0, (prog - 0.8) / 0.2));

        // 1. ДВОЙНЫЕ РЕАКТИВНЫЕ СОПЛА (Оранжевый + Красный)
        if (pFills > 0.5) {
            const flameH = 22 + Math.sin(t * 18) * 8;
            ctx.save();
            ctx.globalAlpha = pFills;

            [-75, 75].forEach((offX, i) => {
                ctx.fillStyle = i === 0 ? "#00c8ff" : "#ff2244";
                ctx.beginPath();
                ctx.moveTo(cx + offX - 16, cy + 110);
                ctx.lineTo(cx + offX, cy + 110 + flameH);
                ctx.lineTo(cx + offX + 16, cy + 110);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.moveTo(cx + offX - 8, cy + 110);
                ctx.lineTo(cx + offX, cy + 110 + flameH * 0.6);
                ctx.lineTo(cx + offX + 8, cy + 110);
                ctx.fill();
            });

            ctx.restore();
        }

        // 2. БРОНИРОВАННЫЕ КРЫЛЬЯ С ПОЛОСАМИ ПЛИМУТРОКА
        const drawTitanWings = (side) => {
            const dir = side === 'left' ? -1 : 1;
            ctx.beginPath();
            ctx.moveTo(cx + dir * 70, cy - 30);
            ctx.lineTo(cx + dir * 185, cy - 90);
            ctx.lineTo(cx + dir * 165, cy - 10);
            ctx.lineTo(cx + dir * 180, cy + 40);
            ctx.lineTo(cx + dir * 125, cy + 80);
            ctx.lineTo(cx + dir * 65, cy + 50);
            ctx.closePath();
        };

        strokePathProgress(() => { drawTitanWings('left'); drawTitanWings('right'); }, 900, pHead, "#00c8ff", 4);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            
            ctx.fillStyle = "#222630";
            drawTitanWings('left'); ctx.fill();
            drawTitanWings('right'); ctx.fill();

            // Полосы Плимутрока на крыльях
            ctx.strokeStyle = "#e2e5ec";
            ctx.lineWidth = 3;
            [-1, 1].forEach(dir => {
                for (let i = -40; i <= 30; i += 18) {
                    ctx.beginPath();
                    ctx.moveTo(cx + dir * 90, cy + i);
                    ctx.lineTo(cx + dir * 150, cy + i - 15);
                    ctx.stroke();
                }
            });

            ctx.strokeStyle = "#00c8ff";
            ctx.lineWidth = 2;
            drawTitanWings('left'); ctx.stroke();
            drawTitanWings('right'); ctx.stroke();
            ctx.restore();
        }

        // 3. ТИТАНОВЫЙ КОРПУС С ПАНЕЛЯМИ ОБОИХ ТОБОТОВ
        const drawTitanBody = () => {
            ctx.moveTo(cx - 75, cy - 70);
            ctx.lineTo(cx + 75, cy - 70);
            ctx.lineTo(cx + 95, cy - 10);
            ctx.lineTo(cx + 65, cy + 110);
            ctx.lineTo(cx - 65, cy + 110);
            ctx.lineTo(cx - 95, cy - 10);
            ctx.closePath();
        };

        strokePathProgress(drawTitanBody, 1000, pHead, "#ffffff", 4);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#2e3440";
            ctx.beginPath(); drawTitanBody(); ctx.fill();

            // Декор Курочки
            ctx.strokeStyle = "#ff2244";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx - 50, cy + 80); ctx.lineTo(cx - 20, cy + 100);
            ctx.moveTo(cx + 50, cy + 80); ctx.lineTo(cx + 20, cy + 100);
            ctx.stroke();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath(); drawTitanBody(); ctx.stroke();
            ctx.restore();
        }

        // 4. ДВУХЦВЕТНЫЙ ИНТЕГРАЦИОННЫЙ РЕАКТОР В ГРУДИ
        const drawTitanReactor = () => {
            ctx.moveTo(cx, cy - 45);
            ctx.lineTo(cx + 40, cy - 10);
            ctx.lineTo(cx + 25, cy + 40);
            ctx.lineTo(cx - 25, cy + 40);
            ctx.lineTo(cx - 40, cy - 10);
            ctx.closePath();
        };

        strokePathProgress(drawTitanReactor, 500, pScreen, "#00c8ff", 3);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;
            ctx.fillStyle = "#0c0e14";
            ctx.beginPath(); drawTitanReactor(); ctx.fill();

            const pulse = Math.sin(t * 6) * 0.2 + 0.8;
            
            // Левая половина - голубая (Гусь)
            ctx.fillStyle = `rgba(0, 200, 255, ${pulse})`;
            ctx.beginPath();
            ctx.arc(cx - 8, cy - 2, 14, 0, Math.PI * 2);
            ctx.fill();

            // Правая половина - красная (Курочка)
            ctx.fillStyle = `rgba(255, 34, 68, ${pulse})`;
            ctx.beginPath();
            ctx.arc(cx + 8, cy - 2, 14, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#00c8ff";
            ctx.lineWidth = 2.5;
            ctx.beginPath(); drawTitanReactor(); ctx.stroke();
            ctx.restore();
        }

        // 5. ДЛИННАЯ ШЕЯ ГУСЯ + ГРЕБЕНЬ И КЛЮВ КУРОЧКИ
        const headWobble = prog >= 1 ? Math.sin(t * 3.5) * 4 : 0;
        const honkOpen   = prog >= 1 ? Math.max(0, Math.sin(t * 5.5)) * 12 : 0;

        const gx = cx + headWobble;
        const gy = cy - 100;

        // Длинная шея
        strokePathProgress(() => {
            ctx.moveTo(cx - 20, cy - 70);
            ctx.lineTo(gx - 15, gy + 20);
            ctx.lineTo(gx + 15, gy + 20);
            ctx.lineTo(cx + 20, cy - 70);
            ctx.closePath();
        }, 250, pChick, "#ffffff", 3);

        // Голова
        strokePathProgress(() => {
            ctx.arc(gx, gy, 28, 0, Math.PI * 2);
        }, 180, pChick, "#ffffff", 3);

        if (pFills > 0) {
            ctx.save();
            ctx.globalAlpha = pFills;

            // Заливка шеи
            ctx.beginPath();
            ctx.fillStyle = "#e5e9f0";
            ctx.moveTo(cx - 20, cy - 70);
            ctx.lineTo(gx - 15, gy + 20);
            ctx.lineTo(gx + 15, gy + 20);
            ctx.lineTo(cx + 20, cy - 70);
            ctx.closePath();
            ctx.fill();

            // Заливка головы
            ctx.beginPath();
            ctx.arc(gx, gy, 28, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            // Красный гребень Курочки
            ctx.beginPath();
            ctx.fillStyle = "#ff1a3c";
            ctx.moveTo(gx - 18, gy - 22);
            ctx.lineTo(gx - 10, gy - 45);
            ctx.lineTo(gx, gy - 32);
            ctx.lineTo(gx + 10, gy - 48);
            ctx.lineTo(gx + 18, gy - 28);
            ctx.closePath();
            ctx.fill();

            // Красная бородка
            ctx.beginPath();
            ctx.fillStyle = "#ff1a3c";
            ctx.ellipse(gx + 10, gy + 22, 6, 12, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // Оранжевый гусиный клюв
            ctx.beginPath();
            ctx.fillStyle = "#ff8c00";
            ctx.moveTo(gx + 12, gy - 6);
            ctx.lineTo(gx + 55, gy + 4);
            ctx.lineTo(gx + 12, gy + 12);
            ctx.closePath();
            ctx.fill();

            // Нижняя челюсть клюва
            ctx.beginPath();
            ctx.fillStyle = "#d08770";
            ctx.moveTo(gx + 12, gy + 12);
            ctx.lineTo(gx + 50, gy + 14 + honkOpen);
            ctx.lineTo(gx + 12, gy + 20 + honkOpen);
            ctx.closePath();
            ctx.fill();

            // Глаз тобота
            ctx.beginPath();
            ctx.arc(gx - 4, gy - 8, 6, 0, Math.PI * 2);
            ctx.fillStyle = "#1e222a";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(gx - 4, gy - 8, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#00c8ff";
            ctx.fill();

            ctx.restore();
        }

        // 6. ТЕКСТ И НАДПИСЬ
        if (pFills > 0.5) {
            const titanScale = prog >= 1 ? (1 + Math.sin(t * 6) * 0.08) : (pFills - 0.5) * 2;
            const bubbleX = gx + 55;
            const bubbleY = gy - 30;

            ctx.save();
            ctx.translate(bubbleX, bubbleY);
            ctx.scale(titanScale, titanScale);

            ctx.beginPath();
            ctx.ellipse(0, 0, 52, 22, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.fillStyle = "#000000";
            ctx.font = "bold 12px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("HONK-CLUCK!", 0, 4);
            ctx.restore();

            ctx.save();
            ctx.fillStyle = `rgba(0, 200, 255, ${pFills})`;
            ctx.shadowColor = "#00c8ff";
            ctx.shadowBlur = 10;
            ctx.font = "bold 18px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("ИНТЕГРАЦИЯ: ПТИЦА-ТИТАН", WIDTH / 2, HEIGHT - 90);
            ctx.restore();
        }
    }

    // --- ВВОД ---
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function checkNodeCollision(pos) {
        for (let id in nodes) {
            const node = nodes[id];
            const dist = Math.hypot(node.x - pos.x, node.y - pos.y);
            const numId = parseInt(id);
            if (dist < 35 && !pattern.includes(numId)) {
                pattern.push(numId);
            }
        }
    }

    function checkPatternMatch(validList) {
        return validList.some(valid => 
            valid.length === pattern.length && 
            valid.every((val, index) => val === pattern[index])
        );
    }

    function handleStart(e) {
        if (state !== "LOCK") return;
        isDrawing = true;
        pattern = [];
        currentPos = getPointerPos(e);
        checkNodeCollision(currentPos);
    }

    function handleMove(e) {
        if (state !== "LOCK" || !isDrawing) return;
        currentPos = getPointerPos(e);
        checkNodeCollision(currentPos);
    }

    function handleEnd() {
        if (state !== "LOCK" || !isDrawing) return;
        isDrawing = false;

        if (checkPatternMatch(goosePatterns)) {
            activeRobot = "GOOSE";
            state = "ROBOT";
            drawProgress = 0;
            resetBtn.style.display = "block";
        } else if (checkPatternMatch(chickenPatterns)) {
            activeRobot = "CHICKEN";
            state = "ROBOT";
            drawProgress = 0;
            resetBtn.style.display = "block";
        } else if (checkPatternMatch(titanPatterns)) {
            activeRobot = "TITAN";
            state = "ROBOT";
            drawProgress = 0;
            resetBtn.style.display = "block";
        } else {
            pattern = [];
        }
    }

    // Клавиатурный ввод Г, К и П
    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'g' || key === 'г') {
            activeRobot = "GOOSE";
            state = "ROBOT";
            drawProgress = 0;
            resetBtn.style.display = "block";
        } else if (key === 'k' || key === 'к') {
            activeRobot = "CHICKEN";
            state = "ROBOT";
            drawProgress = 0;
            resetBtn.style.display = "block";
        } else if (key === 'p' || key === 'п') {
            activeRobot = "TITAN";
            state = "ROBOT";
            drawProgress = 0;
            resetBtn.style.display = "block";
        }
    });

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); });
    window.addEventListener('touchmove', (e) => { handleMove(e); });
    window.addEventListener('touchend', handleEnd);

    resetBtn.addEventListener('click', () => {
        state = "LOCK";
        pattern = [];
        drawProgress = 0;
        resetBtn.style.display = "none";
    });

    // --- ГЛАВНЫЙ ЦИКЛ (60 FPS) ---
    function gameLoop() {
        animTime += 0.03;

        if (state === "LOCK") {
            drawLockScreen(animTime);
        } else if (state === "ROBOT") {
            if (drawProgress < 1) {
                drawProgress += 0.009;
                if (drawProgress > 1) drawProgress = 1;
            }

            if (activeRobot === "GOOSE") {
                drawRobotGoose(animTime, drawProgress);
            } else if (activeRobot === "CHICKEN") {
                drawRobotChicken(animTime, drawProgress);
            } else if (activeRobot === "TITAN") {
                drawRobotTitan(animTime, drawProgress);
            }
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
