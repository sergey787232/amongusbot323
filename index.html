<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тобот-Чертеж с Графическим Ключом</title>
    <style>
        body {
            background-color: #0d1117;
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }
        h1 {
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #8b949e;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
        }
        .main-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }
        #canvas-container {
            position: relative;
            border: 2px solid #30363d;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
            background: #011627;
        }
        canvas {
            display: block;
        }
        /* Графический ключ */
        .pattern-container {
            border: 2px solid #30363d;
            background: #011627;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.1);
        }
        .pattern-title {
            color: #79c0ff;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }
        #pattern-canvas {
            cursor: pointer;
            touch-action: none;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #21262d;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 8px 16px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #30363d;
            color: #79c0ff;
            border-color: #58a6ff;
        }
        .hint {
            color: #8b949e;
            font-size: 11px;
            margin-top: 8px;
            max-width: 180px;
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <h1 id="bot-title">Чертеж Тобота</h1>
    <p>Клавиши: <b>Г</b> / <b>К</b> | Или нарисуйте узор на графическом ключе справа</p>

    <div class="main-container">
        <div id="canvas-container">
            <canvas id="blueprint" width="550" height="450"></canvas>
        </div>

        <div class="pattern-container">
            <div class="pattern-title">ГРАФИЧЕСКИЙ КЛЮЧ</div>
            <canvas id="pattern-canvas" width="180" height="180"></canvas>
            <div class="hint">
                • <b>Гусь:</b> Соедините точки 1→3→9 (в форме буквы Г)<br>
                • <b>Курочка:</b> Соедините точки 1→7, затем 4→3 и 4→9
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="switchMode('G')">Тобот-Гусь (Г)</button>
        <button onclick="switchMode('K')">Тобот-Курочка (К)</button>
    </div>

    <script>
        const canvas = document.getElementById('blueprint');
        const ctx = canvas.getContext('2d');
        const title = document.getElementById('bot-title');

        let currentMode = 'G'; // 'G' — Гусь, 'K' — Курочка

        // --- ОБРАБОТКА КЛАВИШ ---
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'g' || key === 'г') {
                switchMode('G');
            } else if (key === 'k' || key === 'к') {
                switchMode('K');
            }
        });

        function switchMode(mode) {
            currentMode = mode;
            draw();
        }

        // --- ЧЕРТЕЖИ ТОБОТОВ ---
        function drawGrid() {
            ctx.strokeStyle = 'rgba(88, 166, 255, 0.1)';
            ctx.lineWidth = 1;

            for (let x = 0; x < canvas.width; x += 20) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function drawGoose() {
            title.textContent = "Чертеж: Тобот-Гусь";
            ctx.strokeStyle = '#58a6ff';
            ctx.lineWidth = 2;

            ctx.strokeRect(195, 200, 160, 120);

            ctx.beginPath();
            ctx.moveTo(215, 200);
            ctx.lineTo(215, 100);
            ctx.lineTo(255, 100);
            ctx.lineTo(255, 200);
            ctx.stroke();

            ctx.strokeRect(205, 60, 70, 40);

            ctx.beginPath();
            ctx.moveTo(205, 75);
            ctx.lineTo(145, 85);
            ctx.lineTo(205, 95);
            ctx.closePath();
            ctx.stroke();

            ctx.strokeRect(115, 220, 80, 40);
            ctx.strokeRect(355, 220, 80, 40);

            ctx.strokeRect(225, 320, 30, 40);
            ctx.strokeRect(295, 320, 30, 40);

            ctx.fillStyle = '#79c0ff';
            ctx.font = '16px Courier New';
            ctx.fillText("ЗВУКОВОЙ МОДУЛЬ: «HONK!»", 30, 40);
        }

        function drawChicken() {
            title.textContent = "Чертеж: Тобот-Курочка";
            ctx.strokeStyle = '#ff7b72';
            ctx.lineWidth = 2;

            ctx.strokeRect(185, 180, 180, 140);
            ctx.strokeRect(235, 130, 80, 50);
            ctx.strokeRect(225, 70, 100, 60);

            ctx.beginPath();
            ctx.moveTo(245, 70);
            ctx.lineTo(255, 40);
            ctx.lineTo(275, 70);
            ctx.lineTo(285, 40);
            ctx.lineTo(305, 70);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(225, 90);
            ctx.lineTo(185, 105);
            ctx.lineTo(225, 115);
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(240, 125, 8, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeRect(125, 210, 60, 60);
            ctx.strokeRect(365, 210, 60, 60);

            ctx.strokeRect(225, 320, 30, 50);
            ctx.strokeRect(295, 320, 30, 50);

            ctx.fillStyle = '#ffa657';
            ctx.font = '16px Courier New';
            ctx.fillText("ЗВУКОВОЙ МОДУЛЬ: «CLUCK-CLUCK!»", 30, 40);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            if (currentMode === 'G') {
                drawGoose();
            } else if (currentMode === 'K') {
                drawChicken();
            }
        }

        // --- ЛОГИКА ГРАФИЧЕСКОГО КЛЮЧА ---
        const pCanvas = document.getElementById('pattern-canvas');
        const pCtx = pCanvas.getContext('2d');

        const points = [];
        const radius = 12;
        let isDrawing = false;
        let selectedPoints = [];

        // Создаем сетку точек 3x3
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
                points.push({
                    id: row * 3 + col + 1,
                    x: 35 + col * 55,
                    y: 35 + row * 55
                });
            }
        }

        function drawPatternLock(currentMousePos = null) {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            // Отрисовка проведенных линий
            if (selectedPoints.length > 0) {
                pCtx.strokeStyle = '#58a6ff';
                pCtx.lineWidth = 4;
                pCtx.beginPath();

                const first = points.find(p => p.id === selectedPoints[0]);
                pCtx.moveTo(first.x, first.y);

                for (let i = 1; i < selectedPoints.length; i++) {
                    const pt = points.find(p => p.id === selectedPoints[i]);
                    pCtx.lineTo(pt.x, pt.y);
                }

                if (currentMousePos && isDrawing) {
                    pCtx.lineTo(currentMousePos.x, currentMousePos.y);
                }

                pCtx.stroke();
            }

            // Отрисовка точек
            points.forEach(pt => {
                const isSelected = selectedPoints.includes(pt.id);

                pCtx.beginPath();
                pCtx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
                pCtx.fillStyle = isSelected ? '#58a6ff' : '#21262d';
                pCtx.strokeStyle = isSelected ? '#79c0ff' : '#30363d';
                pCtx.lineWidth = 2;
                pCtx.fill();
                pCtx.stroke();

                if (isSelected) {
                    pCtx.beginPath();
                    pCtx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                    pCtx.fillStyle = '#ffffff';
                    pCtx.fill();
                }
            });
        }

        function getPos(e) {
            const rect = pCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function checkPointHit(pos) {
            return points.find(pt => {
                const dist = Math.hypot(pt.x - pos.x, pt.y - pos.y);
                return dist < radius + 8;
            });
        }

        function startPattern(e) {
            isDrawing = true;
            selectedPoints = [];
            const pos = getPos(e);
            const hit = checkPointHit(pos);
            if (hit) {
                selectedPoints.push(hit.id);
            }
            drawPatternLock(pos);
        }

        function movePattern(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            const hit = checkPointHit(pos);
            if (hit && !selectedPoints.includes(hit.id)) {
                selectedPoints.push(hit.id);
            }
            drawPatternLock(pos);
        }

        function endPattern() {
            if (!isDrawing) return;
            isDrawing = false;

            // Проверка узора
            const patternStr = selectedPoints.join('-');

            // Узор для Гуся (Г): 1-2-3-6-9 или 1-3-9 или 1-2-3
            if (patternStr.startsWith('1-2-3') || patternStr.startsWith('1-3') || patternStr === '1-2-3-6-9') {
                switchMode('G');
            } 
            // Узор для Курочки (К): включает точку 4 или пересечения по диагонали (например, 1-4-7 или 3-5-7 или 1-7)
            else if (selectedPoints.includes(4) || patternStr.includes('1-7') || patternStr.includes('1-4-7')) {
                switchMode('K');
            }

            // Очищаем рисунок через небольшую паузу
            setTimeout(() => {
                selectedPoints = [];
                drawPatternLock();
            }, 300);
        }

        // События мыши и Touch
        pCanvas.addEventListener('mousedown', startPattern);
        pCanvas.addEventListener('mousemove', movePattern);
        window.addEventListener('mouseup', endPattern);

        pCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPattern(e); });
        pCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); movePattern(e); });
        window.addEventListener('touchend', endPattern);

        // Старт
        draw();
        drawPatternLock();
    </script>
</body>
</html>
